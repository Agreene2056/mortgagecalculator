<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mortage Calculator</title>
</head>
 
	<style>
	body {
        background-color: #0b0b0d;
        font-family: Arial, sans-serif;
        color: white;
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
    }

    #calculator-card {
        background-color: #141416;
        width: 100%;
        max-width: 400px;
        padding: 30px;
        border: 1px solid #333;
        border-top: 3px solid #8b0000;
        border-radius: 5px;
        box-shadow: 0 0 20px rgba(139,0,0,0.3);
        box-sizing: border-box;
    }
		#calculator-card h2 {
        color: #f2f2f2;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 25px;
    }

    #calculator-card label {
        display: block;
        color: #ddd;
        font-size: 14px;
        margin-top: 18px;
        margin-bottom: 7px;
    }

		#calculator-card button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background-color: #8b0000;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

		</style>
<body>
	<section id="calculator-card">
    <h2>Mortgage Calculator</h2>

    <label for="loanAmount">Loan Amount ($):</label>
    <input type="number" id="loanAmount" placeholder="250000">

    <label for="interestRate">Annual Interest Rate (%):</label>
    <input type="number" id="interestRate" placeholder="6.5" step="0.01">

    <label for="loanTerm">Loan Term (Years):</label>
    <input type="number" id="loanTerm" placeholder="30">

    <button id="calculateBtn">Calculate</button>

    <h3>Monthly Payment:</h3>
    <p id="result">$0.00</p>
</section>

<script src="mortgage.js"></script>
</body>
</html>
